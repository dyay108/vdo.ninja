name: Publish container image

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
    # No path filter on purpose: nearly every file in the repo is served by
    # the image, including the .md docs, so any push to develop is a real
    # content change. Layer caching keeps the rebuild cheap.
  # PRs build (never push) to verify the image still works. The filter lists
  # what the smoke test actually asserts about, so a PR touching any of it
  # gets checked before merge.
  pull_request:
    branches:
      - develop
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/publish-container.yml"
      # The conferencing wrapper. Its routing is asserted by the smoke test -
      # call.html supplies the #prejoin marker used to tell it apart from the
      # stock landing page, and call-theme.css must stay reachable or the UI
      # loads unstyled with nothing else to signal it.
      - "call.html"
      - "call-theme.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Pull requests build to verify the Dockerfile still works, but never
      # push. Fork PRs are not granted packages:write in any case.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap smoke test so a broken nginx config cannot ship silently. Loads
      # the amd64 image on the runner and exercises the routes that the config
      # actually changes.
      - name: Smoke test the built image
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --cache-from type=gha -t vdo-ninja:smoke .
          wait_up() { # $1 = host port, $2 = container name
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$1/healthz" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "FAIL: $2 never became healthy on port $1"; docker logs "$2"; return 1
          }

          check() { # $1 = host port, $2 = path, $3 = expected status
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$1$2")
            if [ "$code" != "$3" ]; then
              echo "FAIL $2 -> $code (expected $3)"; return 1
            fi
            echo "ok   :$1$2 -> $code"
          }

          # Which of the two pages a URL actually returns. A status code cannot
          # tell these apart - both are 200 - so match on a marker unique to
          # each: #prejoin exists only in call.html, #gridlayout only in
          # index.html.
          serves() { # $1 = host port, $2 = path, $3 = wrapper|vdoninja
            # Grep a file rather than piping into grep. `grep -q` exits on the
            # first match and closes the pipe, so the writer takes SIGPIPE -
            # and under `set -o pipefail` that makes the whole pipeline
            # non-zero even though the match succeeded, reporting 'neither'
            # for a page that was served perfectly well. These bodies are
            # 60-225 kB, well past the 64 kB pipe buffer, so it is not a
            # theoretical race.
            curl -s -o /tmp/serves_body "http://127.0.0.1:$1$2"
            if grep -q 'id="prejoin"' /tmp/serves_body; then
              got=wrapper
            elif grep -q 'id="gridlayout"' /tmp/serves_body; then
              got=vdoninja
            else
              got=neither
            fi
            if [ "$got" != "$3" ]; then
              echo "FAIL $2 served '$got' (expected '$3')"; return 1
            fi
            echo "ok   :$1$2 -> $got"
          }

          echo "--- default port ---"
          docker run -d --name vdo-default -p 18080:8080 vdo-ninja:smoke
          wait_up 18080 vdo-default
          for spec in "/ 200" "/healthz 200" "/mixer 200" "/obs/simple 200" \
                      "/main.js 200" "/mixer.html 302" \
                      "/call 200" "/call.html 302" "/call-theme.css 200"; do
            # shellcheck disable=SC2086
            set -- $spec
            check 18080 "$1" "$2" || { docker logs vdo-default; exit 1; }
          done

          # Root routing. The conferencing wrapper owns the bare root, but
          # VDO.Ninja's own entry points are query strings on "/" rather than
          # distinct paths - ?director=, ?view=, ?push=, ?scene=, ?room=.
          # Serving the wrapper for those would shadow them and silently break
          # OBS browser sources, and every one of these still answers 200, so
          # only a content check catches it.
          echo "--- root routing ---"
          for spec in "/|wrapper" "/call|wrapper" "/call?room=x|wrapper" \
                      "/index|vdoninja" "/?director=studio|vdoninja" \
                      "/?view=abc|vdoninja" "/?push=abc|vdoninja" \
                      "/?scene=1&room=x|vdoninja" "/?room=x|vdoninja"; do
            serves 18080 "${spec%%|*}" "${spec##*|}" || { docker logs vdo-default; exit 1; }
          done

          # gzip_static must serve the prebuilt .gz sibling
          curl -s -o /dev/null -H 'Accept-Encoding: gzip' -D /tmp/h http://127.0.0.1:18080/lib.js
          grep -qi '^content-encoding: gzip' /tmp/h || { echo "FAIL lib.js not gzipped"; docker logs vdo-default; exit 1; }
          echo "ok   /lib.js served gzipped"
          docker rm -f vdo-default >/dev/null

          # Exercises the exact hardening docker-compose.yml uses. The tmpfs on
          # /etc/nginx/conf.d is load-bearing: without it the entrypoint cannot
          # render the template and nginx comes up with no server block.
          echo "--- custom VDO_PORT on a read-only rootfs ---"
          # mode=1777 on each tmpfs is required, not cosmetic. Docker creates
          # a tmpfs owned by root, but this image runs as UID 101, so a bare
          # `--tmpfs /etc/nginx/conf.d` mounts a directory nginx cannot write
          # to - the template never renders and the container dies on
          # 10-check-vdo-port.sh. Same applies to /tmp (nginx.pid) and
          # /var/cache/nginx.
          docker run -d --name vdo-custom -e VDO_PORT=9090 \
            --read-only \
            --tmpfs /etc/nginx/conf.d:mode=1777 \
            --tmpfs /tmp:mode=1777 \
            --tmpfs /var/cache/nginx:mode=1777 \
            -p 19090:9090 vdo-ninja:smoke
          wait_up 19090 vdo-custom
          check 19090 /mixer 200 || { docker logs vdo-custom; exit 1; }
          docker rm -f vdo-custom >/dev/null

          echo "--- a privileged VDO_PORT must refuse to start ---"
          if docker run --rm -e VDO_PORT=80 vdo-ninja:smoke >/tmp/bad 2>&1; then
            echo "FAIL: container started despite a privileged VDO_PORT"; cat /tmp/bad; exit 1
          fi
          grep -q 'must be between 1025 and 65535' /tmp/bad \
            || { echo "FAIL: wrong error for privileged port"; cat /tmp/bad; exit 1; }
          echo "ok   privileged port rejected with a clear message"

          # No cleanup needed: vdo-default and vdo-custom are removed above and
          # the privileged-port container ran with --rm. There is deliberately
          # no `docker rm -f vdo-smoke` here - no such container is ever
          # created (vdo-ninja:smoke is the image tag), and as the last command
          # in the step its exit code decided the whole job's result.
